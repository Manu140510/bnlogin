<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de login</title>

<style>

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background-image:url(img.png);
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    margin:0;
}

.login{
    background-color:rgba(93,0,155,0.699);
    padding:20px;
    width:220px;
    border-radius:15px;
    backdrop-filter:blur(10px);

    border:2px solid rgba(255,255,255,0.541);

    box-shadow:
    0 0 15px rgb(255,255,255),
    0 0 30px rgba(255,255,255,0.5);

    color:white;

    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
}

.inputdois{
    width:180px;
    border-radius:10px;
    padding:10px;
    padding-left:35px;
    background-image:url(email.png);
    background-repeat:no-repeat;
    background-size:20px;
    background-position:10px center;
    border:none;
}

.inputtres{
    width:180px;
    border-radius:10px;
    padding:10px;
    padding-left:35px;
    background-image:url(password.png);
    background-repeat:no-repeat;
    background-size:20px;
    background-position:10px center;
    border:none;
}

::placeholder{
    color:black;
}

button{
    border-radius:10px;
    padding:10px 15px;
    cursor:pointer;
    border:none;
    background:white;
    transition:0.3s;
}

button:hover{
    background:black;
    color:white;
}

a{
    color:white;
}

a:active{
    color:black;
}

</style>

</head>
<body>

<div class="login"> 

    <h2>Tela de Login</h2>

    <p>
        <label for="login">Login</label><br><br>

        <input
        class="inputdois"
        type="email"
        id="login"
        placeholder="Digite seu email">
    </p>

    <p>
        <label for="senha">Senha</label><br><br>

        <input
        class="inputtres"
        type="password"
        id="senha"
        placeholder="Digite sua senha">
    </p>

    <p>
        <label>
            <input type="checkbox">
            Lembrar da senha
        </label>
    </p>

    <p>
        <button type="button" onclick="entrar()">
            Entrar
        </button>
    </p>

    <a href="https://manu140510.github.io/bccadastro/">
        Cadastrar
    </a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

 apiKey: "AIzaSyBR189m0ryS7H-gh37Zy2eUv-lwngYv4yM",
  authDomain: "aanot-panda.firebaseapp.com",
  projectId: "aanot-panda",
  storageBucket: "aanot-panda.firebasestorage.app",
  messagingSenderId: "270751971315",
  appId: "1:270751971315:web:04ca8ef0331ce00c7dc486"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

/* LOGIN */

window.entrar = async function(){

    let email =
    document.getElementById("login").value;

    let senha =
    document.getElementById("senha").value;

    if(email === "" || senha === ""){

        alert("Preencha todos os campos!");

        return;

    }

    try{

        /* MANTER LOGIN */

        await setPersistence(
            auth,
            browserLocalPersistence
        );

        /* ENTRAR */

        await signInWithEmailAndPassword(
            auth,
            email,
            senha
        );

        alert("Login realizado com sucesso!");

        window.location.href =
        "https://manu140510.github.io/bnconta/";

    }catch(error){

        alert("Erro: Email ou senha incorretos!");

    }

}

</script>

</body>
</html>
